<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamma Stack - Historical Skills Tech Tree</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Main visualization area */
    #tech-tree {
      flex: 1;
      position: relative;
    }

    #tech-tree svg {
      width: 100%;
      height: 100%;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 300px;
      padding: 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 10;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #f4d03f;
      text-shadow: 0 0 20px rgba(244, 208, 63, 0.5);
    }

    .header p {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 5px;
    }

    /* Era legend */
    .era-legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 10px;
    }

    .era-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .era-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* Side panel */
    .side-panel {
      width: 350px;
      background: rgba(0, 0, 0, 0.8);
      border-left: 1px solid rgba(244, 208, 63, 0.3);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      border-bottom: 2px solid rgba(244, 208, 63, 0.3);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .skill-name {
      font-size: 24px;
      color: #f4d03f;
      margin-bottom: 5px;
    }

    .skill-era {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #f4d03f;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 4px;
      background: #f4d03f;
      border-radius: 50%;
    }

    .module-list, .place-list, .partner-list, .requirement-list, .building-list, .unit-list, .wonder-list {
      list-style: none;
    }

    .module-list li, .place-list li, .partner-list li, .requirement-list li, .building-list li, .unit-list li, .wonder-list li {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 5px;
      border-radius: 5px;
      font-size: 13px;
      border-left: 3px solid transparent;
    }

    .module-list li { border-left-color: #3498db; }
    .place-list li { border-left-color: #2ecc71; }
    .partner-list li { border-left-color: #9b59b6; }
    .requirement-list li { border-left-color: #e74c3c; }
    .building-list li { border-left-color: #f39c12; }
    .unit-list li { border-left-color: #1abc9c; }
    .wonder-list li { border-left-color: #f4d03f; cursor: pointer; transition: all 0.2s; }
    .wonder-list li:hover { background: rgba(244, 208, 63, 0.15); }

    .unlock-subsection {
      margin-bottom: 15px;
    }

    .unlock-label {
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 5px;
    }

    .wonder-location {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 3px;
    }

    .wonder-challenge {
      font-size: 11px;
      font-style: italic;
      opacity: 0.8;
      margin-top: 5px;
      padding: 5px 8px;
      background: rgba(244, 208, 63, 0.1);
      border-radius: 3px;
    }

    .item-type {
      font-size: 10px;
      opacity: 0.6;
      text-transform: uppercase;
      margin-left: 5px;
    }

    .artifact-box {
      background: rgba(244, 208, 63, 0.1);
      border: 1px solid rgba(244, 208, 63, 0.3);
      border-radius: 8px;
      padding: 15px;
    }

    .artifact-desc {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .prerequisites {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .prereq-tag {
      background: rgba(52, 152, 219, 0.2);
      border: 1px solid rgba(52, 152, 219, 0.5);
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .prereq-tag:hover {
      background: rgba(52, 152, 219, 0.4);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.5;
    }

    .empty-state p {
      margin-top: 10px;
    }

    /* D3 styles */
    .node {
      cursor: pointer;
    }

    .node circle {
      stroke-width: 3px;
      transition: all 0.2s;
    }

    .node:hover circle {
      stroke-width: 5px;
      filter: brightness(1.2);
    }

    .node.selected circle {
      stroke: #fff !important;
      stroke-width: 4px;
    }

    .node text {
      font-size: 11px;
      fill: #fff;
      text-anchor: middle;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .link {
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1.5px;
      fill: none;
    }

    .link.highlighted {
      stroke: rgba(244, 208, 63, 0.6);
      stroke-width: 3px;
    }

    /* Controls */
    .controls {
      position: absolute;
      top: 80px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(244, 208, 63, 0.3);
      color: #f4d03f;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(244, 208, 63, 0.2);
    }

    /* Stats */
    .stats {
      position: absolute;
      top: 80px;
      right: 370px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 5px;
    }

    .stat-value {
      color: #f4d03f;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="tech-tree">
      <div class="header">
        <h1>GAMMA STACK</h1>
        <p>Historical Skills Curriculum - Interactive Tech Tree</p>

      <div class="controls">

  </div>

    });

    // Update stats
    document.getElementById('stat-skills').textContent = skills.length;
    document.getElementById('stat-wonders').textContent = wonders.length;
    document.getElementById('stat-links').textContent = links.length;

    // Build era legend
    const legendContainer = document.getElementById('era-legend');
    eraOrder.forEach(era => {
      const item = document.createElement('div');
      item.className = 'era-item';
      item.innerHTML = `<div class="era-dot" style="background: ${eraColors[era]}"></div><span>${eraNames[era]}</span>`;
      legendContainer.appendChild(item);
    });

    // D3 visualization
    const container = document.getElementById('tech-tree');
    const width = container.clientWidth - 350;
    const height = container.clientHeight;

    const svg = d3.select('#tech-tree')
      .append('svg')
      .attr('width', width)
      .attr('height', height);

    // Create zoom behavior
    const zoom = d3.zoom()
      .scaleExtent([0.3, 3])
      .on('zoom', (event) => {
        g.attr('transform', event.transform);
      });

    svg.call(zoom);

    const g = svg.append('g');

    // Arrow marker for links
    svg.append('defs').append('marker')
      .attr('id', 'arrowhead')
      .attr('viewBox', '-0 -5 10 10')
      .attr('refX', 20)
      .attr('refY', 0)
      .attr('orient', 'auto')
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .append('path')
      .attr('d', 'M 0,-5 L 10,0 L 0,5')
      .attr('fill', 'rgba(255,255,255,0.3)');

    // Create node map for links
    const nodeMap = new Map(skills.map(s => [s.id, s]));

    // Calculate positions based on era columns
    let useForceLayout = true;

    function getGridPositions() {
      const eraWidth = width / (eraOrder.length + 1);
      const positions = {};

      eraOrder.forEach((era, eraIdx) => {
        const eraSkills = skills.filter(s => s.era === era);
        const eraHeight = height / (eraSkills.length + 1);

        eraSkills.forEach((skill, idx) => {
          positions[skill.id] = {
            x: (eraIdx + 1) * eraWidth,
            y: (idx + 1) * eraHeight
          };
        });
      });

      return positions;
    }

    // Force simulation
    const simulation = d3.forceSimulation(skills)
      .force('link', d3.forceLink(links).id(d => d.id).distance(100).strength(0.5))
      .force('charge', d3.forceManyBody().strength(-300))
      .force('x', d3.forceX(d => (eraOrder.indexOf(d.era) + 1) * (width / 8)).strength(0.3))
      .force('y', d3.forceY(height / 2).strength(0.1))
      .force('collision', d3.forceCollide().radius(40));

    // Create links
    const link = g.append('g')
      .selectAll('line')
      .data(links)
      .enter()
      .append('line')
      .attr('class', 'link')
      .attr('marker-end', 'url(#arrowhead)');

    // Create nodes
    const node = g.append('g')
      .selectAll('.node')
      .data(skills)
      .enter()
      .append('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', dragstarted)
        .on('drag', dragged)
        .on('end', dragended));

    node.append('circle')
      .attr('r', 18)
      .attr('fill', d => eraColors[d.era])
      .attr('stroke', d => d3.color(eraColors[d.era]).brighter(0.5));

    node.append('text')
      .attr('dy', 35)
      .text(d => d.name.length > 12 ? d.name.substring(0, 10) + '...' : d.name);

    // Click handler for nodes
    let selectedNode = null;

    node.on('click', (event, d) => {
      event.stopPropagation();

      // Update selection
      node.classed('selected', n => n.id === d.id);
      selectedNode = d;

      // Highlight connected links
      link.classed('highlighted', l => l.source.id === d.id || l.target.id === d.id);

      // Show details
      showSkillDetails(d);
    });

    // Click on background to deselect
    svg.on('click', () => {
      node.classed('selected', false);
      link.classed('highlighted', false);
      selectedNode = null;
      showEmptyState();
    });

    // Simulation tick
    simulation.on('tick', () => {
      link
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);

      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    // Drag functions
    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    // UI Functions
    function resetZoom() {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    }

    function toggleLayout() {
      useForceLayout = !useForceLayout;

      if (useForceLayout) {
        simulation.alpha(1).restart();
      } else {
        simulation.stop();
        const positions = getGridPositions();

        node.transition().duration(500)
          .attr('transform', d => {
            const pos = positions[d.id];
            d.x = pos.x;
            d.y = pos.y;
            return `translate(${pos.x},${pos.y})`;
          });

        link.transition().duration(500)
          .attr('x1', d => positions[d.source.id].x)
          .attr('y1', d => positions[d.source.id].y)
          .attr('x2', d => positions[d.target.id].x)
          .attr('y2', d => positions[d.target.id].y);
      }
    }

    function showEmptyState() {
      document.getElementById('skill-details').innerHTML = `
        <div class="empty-state">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          <p>Click on a skill node to view details</p>
        </div>
      `;
    }

        ${skill.prerequisites.length > 0 ? `
          <div class="section">
            <div class="section-title">Prerequisites</div>
            <div class="prerequisites">
              ${skill.prerequisites.map(p => {
                const prereq = nodeMap.get(p);
                return `<span class="prereq-tag" onclick="selectSkill('${p}')" style="border-color: ${eraColors[prereq.era]}">${prereq.name}</span>`;
              }).join('')}

        ` : ''}

        ${skill.unlocks ? `

                ${skill.unlocks.buildings.map(b => `<li>${b.name}<span class="item-type">${b.type}</span><div style="font-size: 11px; opacity: 0.7; margin-top: 3px;">${b.description}</div></li>`).join('')}
              </ul>
            </div>
            <div class="unlock-subsection">
              <div class="unlock-label">Units & Capabilities</div>
              <ul class="unit-list">
                ${skill.unlocks.units.map(u => `<li>${u.name}<span class="item-type">${u.type}</span><div style="font-size: 11px; opacity: 0.7; margin-top: 3px;">${u.description}</div></li>`).join('')}
              </ul>
            </div>
          </div>
        ` : ''}

        ${relatedWonders.length > 0 ? `
          <div class="section">
            <div class="section-title">Related Wonders (${relatedWonders.length})</div>
            <ul class="wonder-list">
              ${relatedWonders.map(w => `
                <li onclick="showWonderDetails('${w.id}')">

          </ul>
        </div>

        <div class="section">
          <div class="section-title">Partners & Mentors (${skill.partners.length})</div>
          <ul class="partner-list">
            ${skill.partners.map(p => `<li>${p.name}<span class="item-type">${p.type}</span></li>`).join('')}
          </ul>
        </div>

        <div class="section">
          <div class="section-title">Artifact</div>
          <div class="artifact-box">
            <div class="artifact-desc">${skill.artifact.description}</div>
            <ul class="requirement-list">
              ${skill.artifact.requirements.map(r => `<li>${r}</li>`).join('')}
            </ul>
          </div>
        </div>
      `;

      document.getElementById('skill-details').innerHTML = html;
    }

    // Function to show wonder details
    window.showWonderDetails = function(wonderId) {
      const wonder = wonders.find(w => w.id === wonderId);
      if (!wonder) return;

      const html = `
        <div class="panel-header">
          <div class="skill-name" style="color: #f4d03f;">${wonder.name}</div>
          <div class="skill-era">${wonder.location}, ${wonder.country}</div>
        </div>

        <div class="section">
          <div class="section-title">Wonder</div>
          <div class="artifact-box" style="border-color: rgba(244, 208, 63, 0.5);">
            <div class="artifact-desc">${wonder.description}</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Challenge</div>
          <div class="artifact-box">
            <div class="artifact-desc">${wonder.challenge}</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Related Skills</div>
          <div class="prerequisites">
            ${wonder.relatedSkills.map(skillId => {
              const skill = skills.find(s => s.id === skillId);
              if (!skill) return '';
              return `<span class="prereq-tag" onclick="selectSkill('${skillId}')" style="border-color: ${eraColors[skill.era]}">${skill.name}</span>`;
            }).join('')}
          </div>
        </div>

        <div class="section">
          <div class="section-title">Era</div>
          <div style="color: ${eraColors[wonder.era]}; font-weight: bold;">${eraNames[wonder.era]}</div>
        </div>
      `;

      document.getElementById('skill-details').innerHTML = html;
    };

    // Global function for clicking prereq tags
    window.selectSkill = function(skillId) {
      const skill = skills.find(s => s.id === skillId);
      if (skill) {
        node.classed('selected', n => n.id === skillId);
        link.classed('highlighted', l => l.source.id === skillId || l.target.id === skillId);
        showSkillDetails(skill);

        // Pan to node
        const nodeData = skills.find(s => s.id === skillId);
        if (nodeData) {
          svg.transition().duration(500).call(
            zoom.transform,
            d3.zoomIdentity.translate(width/2 - nodeData.x, height/2 - nodeData.y)
          );
        }
      }
    };

    // Initial zoom to fit
    setTimeout(() => {
      const bounds = g.node().getBBox();
      const fullWidth = bounds.width;
      const fullHeight = bounds.height;
      const midX = bounds.x + fullWidth / 2;
      const midY = bounds.y + fullHeight / 2;
      const scale = 0.8 / Math.max(fullWidth / width, fullHeight / height);
      const translate = [width / 2 - scale * midX, height / 2 - scale * midY];

      svg.transition().duration(750).call(
        zoom.transform,
        d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
      );
    }, 1000);
  </script>
</body>
</html>
